<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>可视化大屏 · 武汉 CityOS</title>
<link rel="stylesheet" href="assets/css/main.css" />
<style>
  /* ---------- 大屏专用视觉 ---------- */
  body { overflow: hidden; background: var(--bg-deep); }
  /* 1920×1080 设计稿 + transform scale 自适应（DataV 标准实践） */
  .stage-shell {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .screen {
    width: 1920px; height: 1080px; flex-shrink: 0;
    display: flex; flex-direction: column;
    transform-origin: center center;
    background:
      radial-gradient(1400px 500px at 50% -10%, rgba(79, 195, 247, 0.10), transparent 60%),
      radial-gradient(1000px 600px at 50% 115%, rgba(124, 92, 255, 0.10), transparent 60%),
      var(--bg-deep);
  }
  /* 顶部 */
  .s-head {
    height: 76px; flex-shrink: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(79,195,247,0.12), transparent);
    border-bottom: 1px solid var(--border);
  }
  .s-head::after {
    content: ""; position: absolute; bottom: -1px; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 12px var(--accent);
  }
  .s-head h1 {
    font-size: 26px; letter-spacing: 10px; font-weight: 700;
    background: linear-gradient(180deg, #fff, #7ec8f5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(79, 195, 247, 0.35);
  }
  .s-head .side { position: absolute; top: 50%; transform: translateY(-50%); display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-mid); }
  .s-head .side.l { left: 24px; }
  .s-head .side.r { right: 24px; font-family: var(--mono); }
  .s-head .back { font-size: 12px; }

  /* 主体三列 */
  .s-body { flex: 1; display: grid; grid-template-columns: 330px 1fr 330px; gap: 14px; padding: 14px 18px 0; min-height: 0; }
  .s-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  .spanel {
    position: relative; border: 1px solid var(--border);
    background: rgba(10, 17, 32, 0.72); border-radius: 6px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .spanel::before, .spanel::after,
  .spanel .cn::before, .spanel .cn::after {
    content: ""; position: absolute; width: 12px; height: 12px;
    border: 2px solid var(--accent); opacity: 0.7;
  }
  .spanel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .spanel::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .spanel .cn::before { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .spanel .cn::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
  .spanel .st {
    padding: 10px 14px 8px; font-size: 13.5px; letter-spacing: 2px; font-weight: 600;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  }
  .spanel .st::before { content: "◆"; color: var(--accent); font-size: 10px; }
  .spanel .st .extra { margin-left: auto; font-size: 10px; color: var(--text-low); letter-spacing: 1px; font-weight: 400; }
  .spanel .sb { padding: 10px 14px; flex: 1; min-height: 0; position: relative; }

  /* 大数字 */
  .big-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 0 18px; }
  .bnum {
    text-align: center; padding: 10px 0 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: linear-gradient(180deg, rgba(79,195,247,0.08), transparent);
    position: relative; overflow: hidden;
  }
  .bnum .v {
    font-family: var(--mono); font-size: 30px; font-weight: 700; color: #7ee0ff;
    text-shadow: 0 0 18px rgba(79, 195, 247, 0.6);
  }
  .bnum .v .u { font-size: 12px; color: var(--text-low); margin-left: 4px; }
  .bnum .l { font-size: 11.5px; color: var(--text-mid); margin-top: 4px; letter-spacing: 2px; }
  .bnum .scan {
    position: absolute; left: 0; right: 0; height: 36px; top: -40px;
    background: linear-gradient(180deg, transparent, rgba(126, 224, 255, 0.12), transparent);
    animation: scan 4s linear infinite;
  }
  @keyframes scan { to { top: 110%; } }

  /* 中央地图 */
  .map-wrap { flex: 1; position: relative; min-height: 0; }
  .map-wrap svg { width: 100%; height: 100%; display: block; }
  .road-flow { stroke-dasharray: 6 14; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .pulse-ring { animation: pring 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pring { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
  .evt-flash { animation: eflash 1s ease-in-out infinite alternate; }
  @keyframes eflash { from { opacity: 1; } to { opacity: 0.35; } }

  /* 事件滚动 */
  .evt-scroll { overflow: hidden; position: relative; height: 100%; }
  .evt-track { position: absolute; left: 0; right: 0; transition: transform 0.6s ease; }
  .evt-row {
    display: flex; gap: 8px; align-items: center; padding: 7px 2px;
    font-size: 12px; border-bottom: 1px dashed rgba(120, 180, 255, 0.12);
  }
  .evt-row .t { font-family: var(--mono); color: var(--text-low); font-size: 11px; flex-shrink: 0; }
  .evt-row .m { color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .evt-row.new { animation: rowIn 0.6s ease; }
  @keyframes rowIn { from { background: rgba(79,195,247,0.25); } to { background: transparent; } }

  /* 底部滚动条 */
  .s-foot {
    flex-shrink: 0; height: 34px; margin-top: 14px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; overflow: hidden;
    background: rgba(8, 13, 26, 0.8);
  }
  .s-foot .label {
    flex-shrink: 0; padding: 0 16px; color: var(--accent); font-size: 12px; letter-spacing: 2px;
    border-right: 1px solid var(--border); height: 100%; display: flex; align-items: center;
  }
  .marquee { flex: 1; overflow: hidden; }
  .marquee .track { display: inline-flex; gap: 60px; white-space: nowrap; animation: mq 36s linear infinite; font-size: 12px; color: var(--text-mid); }
  @keyframes mq { to { transform: translateX(-50%); } }

  .jam-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0; }
  .jam-row .rn { font-family: var(--mono); width: 20px; color: var(--text-low); }
  .jam-row .nm { width: 84px; flex-shrink: 0; color: var(--text-mid); }
  .jam-row .bar { flex: 1; }
  .jam-row .vl { width: 40px; text-align: right; font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<div class="stage-shell">
<div class="screen" id="stage">
  <!-- 头部 -->
  <div class="s-head">
    <div class="side l">
      <span id="w-info">--</span>
      <a class="btn sm back" href="index.html">← 管理端</a>
    </div>
    <h1>武汉城市运行指挥中心</h1>
    <div class="side r"><span id="s-date">--</span><span id="s-clock" style="color:var(--accent)">--:--:--</span></div>
  </div>

  <!-- 大数字 -->
  <div class="big-nums" style="margin-top:14px">
    <div class="bnum"><div class="scan"></div><div class="v"><span id="bn-flow">0</span><span class="u">辆/h</span></div><div class="l">实时车流</div></div>
    <div class="bnum"><div class="scan"></div><div class="v"><span id="bn-load">0</span><span class="u">MW</span></div><div class="l">用电负荷</div></div>
    <div class="bnum"><div class="scan"></div><div class="v"><span id="bn-aqi">0</span><span class="u">AQI</span></div><div class="l">空气质量</div></div>
    <div class="bnum"><div class="scan"></div><div class="v"><span id="bn-online">0</span><span class="u">台</span></div><div class="l">在线设备</div></div>
  </div>

  <!-- 三列 -->
  <div class="s-body">
    <!-- 左列 -->
    <div class="s-col">
      <div class="spanel" style="flex:1.1"><span class="cn"></span>
        <div class="st">能源结构 <span class="extra">实时出力</span></div>
        <div class="sb"><div class="chart" id="ch-mix" style="height:100%;min-height:0"></div></div>
      </div>
      <div class="spanel" style="flex:1"><span class="cn"></span>
        <div class="st">环境质量 <span class="extra">近 7 日 AQI</span></div>
        <div class="sb"><div class="chart" id="ch-aqi" style="height:100%;min-height:0"></div></div>
      </div>
      <div class="spanel" style="flex:1"><span class="cn"></span>
        <div class="st">应急资源 <span class="extra">可用率</span></div>
        <div class="sb" id="res-list"></div>
      </div>
    </div>

    <!-- 中列：地图 + 趋势 -->
    <div class="s-col">
      <div class="spanel" style="flex:1.7"><span class="cn"></span>
        <div class="st">城市运行一张图 <span class="extra">路网 · 轨道 · 事件</span></div>
        <div class="sb map-wrap" id="map-box">
          <svg viewBox="0 0 900 560" id="city-map">
            <defs>
              <linearGradient id="river-g" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#1a4f6e"/><stop offset="0.5" stop-color="#2a7bb0"/><stop offset="1" stop-color="#1a4f6e"/>
              </linearGradient>
              <radialGradient id="poi-g"><stop offset="0" stop-color="#7ee0ff"/><stop offset="1" stop-color="#7ee0ff" stop-opacity="0"/></radialGradient>
            </defs>
            <!-- 底网 -->
            <g stroke="rgba(120,180,255,0.05)" stroke-width="1">
              <path d="M0 80 H900 M0 160 H900 M0 240 H900 M0 320 H900 M0 400 H900 M0 480 H900"/>
              <path d="M100 0 V560 M200 0 V560 M300 0 V560 M400 0 V560 M500 0 V560 M600 0 V560 M700 0 V560 M800 0 V560"/>
            </g>
            <!-- 山体剪影 -->
            <path d="M0 560 L0 470 Q120 420 210 460 T420 440 Q520 400 640 450 T900 430 L900 560 Z"
                  fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
            <!-- 河流 -->
            <path id="river" d="M460 0 Q430 90 480 170 T440 330 Q420 430 470 560"
                  fill="none" stroke="url(#river-g)" stroke-width="26" stroke-linecap="round" opacity="0.85"/>
            <path d="M460 0 Q430 90 480 170 T440 330 Q420 430 470 560"
                  fill="none" stroke="rgba(126,224,255,0.35)" stroke-width="2" class="road-flow"/>
            <!-- 跨河大桥 -->
            <line x1="380" y1="248" x2="560" y2="252" stroke="#d0d5da" stroke-width="6"/>
            <line x1="380" y1="248" x2="560" y2="252" stroke="#2b2f36" stroke-width="2" stroke-dasharray="8 6"/>
            <!-- 主干道（车流光线） -->
            <g stroke-width="3" fill="none">
              <path id="rd1" d="M60 250 H840" stroke="rgba(79,195,247,0.55)" class="road-flow"/>
              <path id="rd2" d="M60 120 H840" stroke="rgba(79,195,247,0.4)" class="road-flow" style="animation-duration:2.2s"/>
              <path id="rd3" d="M60 380 H840" stroke="rgba(79,195,247,0.4)" class="road-flow" style="animation-duration:2.6s"/>
              <path id="rd4" d="M200 40 V520" stroke="rgba(124,92,255,0.45)" class="road-flow" style="animation-duration:2s"/>
              <path id="rd5" d="M680 40 V520" stroke="rgba(124,92,255,0.45)" class="road-flow" style="animation-duration:2.4s"/>
              <path id="rd6" d="M340 40 V520" stroke="rgba(124,92,255,0.3)" class="road-flow" style="animation-duration:3s"/>
            </g>
            <!-- 行驶车辆光点 -->
            <g>
              <circle r="4" fill="#7ee0ff"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#rd1"/></animateMotion></circle>
              <circle r="4" fill="#7ee0ff"><animateMotion dur="12s" begin="-4s" repeatCount="indefinite"><mpath href="#rd1"/></animateMotion></circle>
              <circle r="3.5" fill="#b79bff"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#rd4"/></animateMotion></circle>
              <circle r="3.5" fill="#b79bff"><animateMotion dur="14s" begin="-6s" repeatCount="indefinite"><mpath href="#rd5"/></animateMotion></circle>
              <circle r="3.5" fill="#ffd98a"><animateMotion dur="13s" repeatCount="indefinite"><mpath href="#rd3"/></animateMotion></circle>
              <circle r="3" fill="#7ee0ff"><animateMotion dur="10s" begin="-2s" repeatCount="indefinite"><mpath href="#rd2"/></animateMotion></circle>
            </g>
            <!-- 城区标注 -->
            <g font-size="13" fill="#a9bcd8" text-anchor="middle" letter-spacing="2">
              <text x="450" y="105" fill="#e8f1ff" font-weight="600">汉口滨江商务区</text>
              <text x="150" y="230">汉阳居住区</text>
              <text x="760" y="230">武昌综合区</text>
              <text x="150" y="430">青山工业区</text>
              <text x="680" y="505">东湖生态区</text>
              <text x="790" y="430">阳逻港区</text>
            </g>
            <!-- CBD 楼群剪影 -->
            <g fill="rgba(126,224,255,0.16)" stroke="rgba(126,224,255,0.4)" stroke-width="1">
              <rect x="410" y="150" width="18" height="98"/><rect x="434" y="128" width="20" height="120"/>
              <rect x="460" y="140" width="16" height="108"/><rect x="482" y="118" width="22" height="130"/>
              <rect x="510" y="150" width="18" height="98"/><rect x="392" y="172" width="14" height="76"/>
              <rect x="534" y="168" width="14" height="80"/>
            </g>
            <!-- 重点设施脉冲点 -->
            <g id="poi-layer"></g>
            <!-- 事件动态层 -->
            <g id="evt-layer"></g>
          </svg>
        </div>
      </div>
      <div class="spanel" style="flex:1"><span class="cn"></span>
        <div class="st">实时趋势 <span class="extra">车流 / 负荷 · 滚动 3 分钟</span></div>
        <div class="sb"><div class="chart" id="ch-live" style="height:100%;min-height:0"></div></div>
      </div>
    </div>

    <!-- 右列 -->
    <div class="s-col">
      <div class="spanel" style="flex:1.05"><span class="cn"></span>
        <div class="st">拥堵指数 TOP5 <span class="extra">实时</span></div>
        <div class="sb" id="jam-list"></div>
      </div>
      <div class="spanel" style="flex:0.9"><span class="cn"></span>
        <div class="st">轨道满载率 <span class="extra">4 条线路</span></div>
        <div class="sb" id="metro-list"></div>
      </div>
      <div class="spanel" style="flex:1.35"><span class="cn"></span>
        <div class="st">实时事件 <span class="extra" id="evt-total">--</span></div>
        <div class="sb evt-scroll"><div class="evt-track" id="evt-track"></div></div>
      </div>
    </div>
  </div>

  <!-- 底部滚动 -->
  <div class="s-foot">
    <div class="label">城市快报</div>
    <div class="marquee"><div class="track" id="mq-track"></div></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/live.js"></script>
<script>
/* ---------- 1920×1080 舞台缩放 ---------- */
function fitStage() {
  const vw = window.innerWidth || 1920;
  const vh = window.innerHeight || 1080;
  const s = Math.min(vw / 1920, vh / 1080);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
fitStage();
window.addEventListener('resize', fitStage);
</script>
<script>
const D = CITY_DATA, H = CityOS;
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- 时钟与日期 ---------- */
{
  const pad = n => String(n).padStart(2, '0');
  const tick = () => {
    const d = new Date();
    const week = '日一二三四五六'[d.getDay()];
    document.getElementById('s-date').textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} 周${week}`;
    document.getElementById('s-clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  tick(); setInterval(tick, 1000);
  document.getElementById('w-info').textContent =
    `🌡 ${D.overview.weather.temp}°C · ${D.overview.weather.text} · ${D.overview.weather.wind}`;
}

/* ---------- 大数字（含首屏滚动） ---------- */
{
  const t0 = CityLive.now();
  H.countUp(document.getElementById('bn-flow'), t0.flow, { duration: 1600 });
  H.countUp(document.getElementById('bn-load'), t0.load, { duration: 1600 });
  H.countUp(document.getElementById('bn-aqi'), D.environment.aqi, { duration: 1600 });
  H.countUp(document.getElementById('bn-online'), t0.online, { duration: 1600 });
}

/* ---------- 能源结构 ---------- */
H.makeChart(document.getElementById('ch-mix'), {
  tooltip: { trigger: 'item', formatter: '{b}：{c}%' },
  series: [{
    type: 'pie', radius: ['48%', '74%'], center: ['50%', '52%'],
    itemStyle: { borderColor: '#0a1020', borderWidth: 2, borderRadius: 6 },
    label: { color: '#a9bcd8', fontSize: 10.5 },
    data: D.energy.mix,
  }],
});

/* ---------- AQI ---------- */
H.makeChart(document.getElementById('ch-aqi'), {
  xAxis: { type: 'category', data: ['-6d', '-5d', '-4d', '-3d', '前天', '昨天', '今天'] },
  yAxis: { type: 'value', min: 0, max: 120 },
  series: [{
    type: 'line', data: D.environment.aqiWeek, smooth: true, symbolSize: 5,
    lineStyle: { width: 2, color: '#34d399' }, itemStyle: { color: '#34d399' },
    areaStyle: { opacity: 0.18 },
  }],
  grid: { left: 8, right: 10, top: 14, bottom: 4, containLabel: true },
});

/* ---------- 应急资源可用率 ---------- */
{
  const box = document.getElementById('res-list');
  D.emergency.resources.slice(0, 4).forEach(r => {
    const pct = Math.round(r.available / r.total * 100);
    const row = document.createElement('div');
    row.style.marginBottom = '10px';
    row.innerHTML = `<div class="flex-between" style="margin-bottom:4px;font-size:12px">
        <span style="color:var(--text-mid)">${r.name}</span><span class="mono" style="font-size:11px">${pct}%</span></div>
      <div class="bar ${pct >= 80 ? 'ok' : 'warn'}"><i style="width:${pct}%"></i></div>`;
    box.appendChild(row);
  });
}

/* ---------- 拥堵 TOP5（可实时重排） ---------- */
const jamState = D.traffic.congestionIndex
  .map(r => ({ name: r.name, index: r.index }))
  .sort((a, b) => b.index - a.index).slice(0, 5);
function renderJam() {
  const box = document.getElementById('jam-list');
  box.innerHTML = '';
  jamState.forEach((r, i) => {
    const pct = Math.min(100, r.index / 3 * 100);
    const cls = r.index >= 2.1 ? 'danger' : r.index >= 1.7 ? 'warn' : 'ok';
    const row = document.createElement('div');
    row.className = 'jam-row';
    row.innerHTML = `<span class="rn">${i + 1}</span><span class="nm">${r.name}</span>
      <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
      <span class="vl">${r.index.toFixed(2)}</span>`;
    box.appendChild(row);
  });
}
renderJam();

/* ---------- 轨道 ---------- */
{
  const box = document.getElementById('metro-list');
  D.traffic.transit.metroLines.forEach(l => {
    const row = document.createElement('div');
    row.style.marginBottom = '9px';
    row.innerHTML = `<div class="flex-between" style="margin-bottom:4px;font-size:12px">
        <span><i class="dot" style="background:${l.color};box-shadow:0 0 6px ${l.color}"></i>${l.name}</span>
        <span class="mono" style="font-size:11px">${Math.round(l.crowd * 100)}%</span></div>
      <div class="bar ${l.crowd > 0.75 ? 'warn' : 'ok'}"><i style="width:${l.crowd * 100}%"></i></div>`;
    box.appendChild(row);
  });
}

/* ---------- 实时趋势（滚动窗口） ---------- */
const livePts = { flow: [], load: [], labels: [] };
{
  const now = Date.now();
  for (let i = 60; i >= 0; i -= 3) {
    const t = new Date(now - i * 1000);
    const pad = n => String(n).padStart(2, '0');
    livePts.labels.push(`${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`);
    livePts.flow.push(Math.max(0, D.traffic.flow24h[t.getHours()] + (Math.random() - 0.5) * 400));
    livePts.load.push(Math.max(0, D.energy.load24h[t.getHours()] + (Math.random() - 0.5) * 40));
  }
}
const liveChart = H.makeChart(document.getElementById('ch-live'), {
  xAxis: { type: 'category', data: livePts.labels, boundaryGap: false, axisLabel: { interval: 9 } },
  yAxis: [
    { type: 'value', name: '辆/h', scale: true },
    { type: 'value', name: 'MW', scale: true, splitLine: { show: false } },
  ],
  series: [
    { name: '车流', type: 'line', data: livePts.flow, smooth: true, symbol: 'none',
      lineStyle: { width: 2 }, areaStyle: { opacity: 0.14 } },
    { name: '负荷', type: 'line', data: livePts.load, smooth: true, symbol: 'none', yAxisIndex: 1,
      lineStyle: { width: 2, color: '#fbbf24' }, itemStyle: { color: '#fbbf24' } },
  ],
  grid: { left: 8, right: 10, top: 24, bottom: 4, containLabel: true },
});

/* ---------- 事件流（自动滚动 + 实时插入） ---------- */
const evtTrack = document.getElementById('evt-track');
let evtCount = D.emergency.events.length;
function evtRow(ev, isNew) {
  const div = document.createElement('div');
  div.className = 'evt-row' + (isNew ? ' new' : '');
  const tagCls = { danger: 'danger', warn: 'warn', info: 'info', mute: 'mute' }[ev.level];
  div.innerHTML = `<span class="t">${ev.time}</span>
    <span class="tag ${tagCls}" style="flex-shrink:0">${ev.type}</span>
    <span class="m">${ev.place}</span>`;
  return div;
}
D.emergency.events.slice(0, 10).forEach(ev => evtTrack.appendChild(evtRow(ev, false)));
document.getElementById('evt-total').textContent = '今日 ' + evtCount + ' 起';
// 自动上滚
let scrollOffset = 0;
setInterval(() => {
  const rowH = 34;
  const max = evtTrack.children.length * rowH - evtTrack.parentElement.clientHeight;
  if (max <= 0) return;
  scrollOffset = scrollOffset >= max ? 0 : scrollOffset + rowH;
  evtTrack.style.transform = `translateY(${-scrollOffset}px)`;
}, 2600);

/* ---------- 地图 POI 脉冲点 ---------- */

[[455, 190, '汉口'], [200, 250, '汉阳'], [700, 250, '武昌'], [200, 400, '青山'], [680, 470, '东湖'], [760, 400, '阳逻']]
  .forEach(([x, y, name]) => {

    const core = document.createElementNS(SVGNS, 'circle');
    core.setAttribute('cx', x); core.setAttribute('cy', y); core.setAttribute('r', 4);
    core.setAttribute('fill', 'url(#poi-g)');
    g.appendChild(ring); g.appendChild(core);

/* 事件在地图上闪烁定位 */
const evtLayer = document.getElementById('evt-layer');
const MAP_SPOTS = [[300, 120], [520, 250], [240, 380], [660, 250], [420, 380], [700, 120], [200, 250], [560, 430]];
function flashOnMap(level) {
  const [x, y] = MAP_SPOTS[Math.floor(Math.random() * MAP_SPOTS.length)];
  const color = level === 'danger' ? '#f87171' : level === 'warn' ? '#fbbf24' : '#60a5fa';
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 9);
  c.setAttribute('fill', 'none'); c.setAttribute('stroke', color); c.setAttribute('stroke-width', '2.5');
  c.setAttribute('class', 'evt-flash');
  evtLayer.appendChild(c);
  setTimeout(() => c.remove(), 14000);
}

/* ---------- 接入实时引擎 ---------- */
CityLive.on('tick', t => {
  document.getElementById('bn-flow').textContent = H.fmt(Math.round(t.flow));
  document.getElementById('bn-load').textContent = H.fmt(Math.round(t.load));
  document.getElementById('bn-aqi').textContent = Math.round(t.aqi);
  document.getElementById('bn-online').textContent = H.fmt(t.online);
  // 拥堵指数轻微漂移
  jamState.forEach(j => {
    j.index = Math.max(1.0, Math.min(2.9, j.index + (Math.random() - 0.5) * 0.06));
  });
  jamState.sort((a, b) => b.index - a.index);
  renderJam();
  // 趋势滚动
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  livePts.labels.push(`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);
  livePts.flow.push(t.flow);
  livePts.load.push(t.load);
  if (livePts.labels.length > 62) {
    livePts.labels.shift(); livePts.flow.shift(); livePts.load.shift();
  }
  liveChart.setOption({ xAxis: { data: livePts.labels }, series: [{ data: livePts.flow }, { data: livePts.load }] });
});
CityLive.on('event', ev => {
  evtCount += 1;
  document.getElementById('evt-total').textContent = '今日 ' + evtCount + ' 起';
  evtTrack.prepend(evtRow(ev, true));
  if (evtTrack.children.length > 30) evtTrack.lastChild.remove();
  flashOnMap(ev.level);
});
CityLive.start();
